[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-marketplace"
version = "0.0.4"
description = "Python client for the DeepNLP AI Agent Marketplace search and registry API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "DeepNLP", email = "aihubadmin@126.com"}]
keywords = ["ai-agent", "marketplace", "registry", "search", "deepnlp", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.17.0",
    "importlib_resources>=1.3; python_version < '3.9'",
]

[project.urls]
Homepage = "https://www.deepnlp.org/store/ai-agent"
Repository = "https://github.com/aiagenta2z/ai-agent-marketplace"
Documentation = "https://github.com/aiagenta2z/ai-agent-marketplace#readme"
PyPI = "https://pypi.org/project/ai-agent-marketplace/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_agent_marketplace = ["data/*.json"]
